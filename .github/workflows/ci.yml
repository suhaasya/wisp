name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  lint:
    name: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.0
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: lint
          save-if: true

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.20.2,cargo-audit@0.22.2

      - name: Verify supply-chain tools on PATH
        run: |
          cargo-deny --version
          cargo-audit --version

      - name: fmt
        run: cargo xtask ci fmt

      - name: theme literals
        run: cargo xtask ci theme-literals

      - name: secret config
        run: cargo xtask ci secret-config

      - name: clippy
        run: cargo xtask ci clippy

      - name: deny
        run: cargo xtask ci deny

      - name: audit
        run: cargo xtask ci audit

  secrets:
    name: secret storage (LUM-009)
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            run: cargo test -p wisp-store
            secret_backend: mock
            keyring_it: ""
          - os: macos-14
            run: cargo test -p wisp-store --test keyring_integration
            secret_backend: ""
            keyring_it: "1"
          - os: windows-latest
            run: cargo test -p wisp-store
            secret_backend: mock
            keyring_it: ""
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.0

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: secrets-${{ matrix.os }}
          save-if: true

      - name: test
        env:
          WISP_SECRET_BACKEND: ${{ matrix.secret_backend }}
          WISP_KEYRING_IT: ${{ matrix.keyring_it }}
        run: ${{ matrix.run }}

  postgres:
    name: postgres driver (LUM-012)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: wisp
          POSTGRES_PASSWORD: wisp
          POSTGRES_DB: wisp_bench
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wisp -d wisp_bench"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.0

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: postgres
          save-if: true

      - name: integration tests
        env:
          WISP_PG_IT: "1"
          PGHOST: localhost
          PGUSER: wisp
          PGPASSWORD: wisp
          PGDATABASE: wisp_bench
          PGPORT: "5432"
        run: cargo test -p wisp-drivers --test postgres_integration

  mysql:
    name: mysql driver (LUM-013)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: wisp
          MYSQL_DATABASE: wisp_bench
          MYSQL_USER: wisp
          MYSQL_PASSWORD: wisp
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -pwisp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.0

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: mysql
          save-if: true

      - name: integration tests
        env:
          WISP_MYSQL_IT: "1"
          MYSQL_HOST: 127.0.0.1
          MYSQL_USER: wisp
          MYSQL_PASSWORD: wisp
          MYSQL_DATABASE: wisp_bench
          MYSQL_PORT: "3306"
        run: cargo test -p wisp-drivers --test mysql_integration

