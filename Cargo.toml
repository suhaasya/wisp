[workspace]
resolver = "2"
members = [
    "app",
    "core",
    "drivers",
    "store",
    "transport",
    "ui",
    "xtask",
]
default-members = [
    "app",
    "core",
    "drivers",
    "store",
    "transport",
    "ui",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.99"
publish = false

[workspace.dependencies]
# Shared third-party versions (add crates here as features land in later milestones).
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"
tokio = { version = "1.43", features = ["macros", "rt-multi-thread"] }
tracing = "0.1"
clap = { version = "4.5", features = ["derive"] }
serde_json = "1.0"
rpassword = "7.3"

gpui = { git = "https://github.com/zed-industries/zed", rev = "dc3fb21676457b84d2233ac4c6bec5cebc698ec3" }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "dc3fb21676457b84d2233ac4c6bec5cebc698ec3", features = [
    "font-kit",
    "wayland",
    "x11",
] }

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = "s"
panic = "abort"
strip = true

# Hot paths: grid and render code in ui/core stay fully optimized while the rest sizes down.
[profile.release.package.wisp-core]
opt-level = 3

[profile.release.package.wisp-ui]
opt-level = 3

[profile.dist]
inherits = "release"
debug = false
incremental = false

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
# Pedantic subset: high-signal lints without enabling the full pedantic group.
cloned_instead_of_copied = "warn"
enum_glob_use = "warn"
explicit_into_iter_loop = "warn"
filter_map_next = "warn"
flat_map_option = "warn"
implicit_clone = "warn"
inefficient_to_string = "warn"
manual_let_else = "warn"
map_unwrap_or = "warn"
match_wildcard_for_single_variants = "warn"
needless_continue = "warn"
needless_for_each = "warn"
ref_option_ref = "warn"
semicolon_if_nothing_returned = "warn"
trivially_copy_pass_by_ref = "warn"
unused_self = "warn"
