[package]
name = "wisp-store"
description = "Configuration, secrets, and history persistence for Wisp"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
directories = "6.0"
notify = "8.0"
serde.workspace = true
serde_json = "1.0"
thiserror.workspace = true
toml = { version = "0.8", default-features = false, features = ["parse", "display"] }
keyring = { version = "3.6", default-features = false, features = [
    "apple-native",
    "windows-native",
    "sync-secret-service",
] }
argon2 = { version = "0.5", default-features = false, features = ["std"] }
chacha20poly1305 = { version = "0.10", default-features = false, features = [
    "std",
    "rand_core",
] }
rand = { version = "0.8", default-features = false, features = ["std_rng", "getrandom"] }
zeroize = { version = "1.8", features = ["derive"] }

[dev-dependencies]
tempfile = "3.14"
